<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Family Members</title>

    <link rel="stylesheet" href="/web/global.css">

</head>

<body>

    <header class="header">

    <div class="logo">

        🕌 Mahall Management System

    </div>

    <div class="user-info">

        Welcome, Admin

        <button
            class="logout-btn"
            onclick="window.location.href='/'">

            Logout

        </button>

    </div>

</header>

<nav class="navbar">

    <a href="/dashboard">Dashboard</a>

    <a href="/member_registration" class="active">Members</a>

    <a href="/donation">Donations</a>

    <a href="/expense">Expenses</a>

    <a href="/salary">Salary</a>

    <a href="/cash_register">Cash Register</a>

    <a href="/reports">Reports</a>

</nav>

<div class="page-container">

<div class="container">

<h1>Family Members</h1>
     
        <button
            type="button"
            onclick="goBackToMembers()">

            ← Back to Member Registration

        </button>

<form id="memberForm">

    <div class="card">

        <h2>Add Member</h2>

        <div class="row">

            <div class="form-group">

                <label>Member Name</label>

                <input type="text" id="member_name">

            </div>

            <div class="form-group">

                <label>Gender</label>

                <select id="gender">

                    <option>Male</option>
                    <option>Female</option>

                </select>

            </div>

        </div>

        <div class="row">

            <div class="form-group">

                <label>Age</label>

                <input type="number" id="age">

            </div>

            <div class="form-group">

                <label>Relationship</label>

                <select id="relationship">

                    <option>Head</option>
                    <option>Wife</option>
                    <option>Son</option>
                    <option>Daughter</option>
                    <option>Father</option>
                    <option>Mother</option>
                    <option>Brother</option>
                    <option>Sister</option>
                    <option>Other</option>

                </select>

            </div>

        </div>

        <div class="row">

            <div class="form-group">

                <label>Occupation</label>

                <input type="text" id="occupation">

            </div>

            <div class="form-group">

                <label>Education</label>

                <input type="text" id="education">

            </div>

        </div>

        <div class="button-group">
            
            <button 
                type="button" 
                id="addMember">

                Add Member

            </button>
        </div>

    </div>

</form>

<h2>Members Added</h2>

<table border="1" width="100%">

<thead>

<tr>

<th>Name</th>

<th>Gender</th>

<th>Age</th>

<th>Relationship</th>

<th>Occupation</th>

<th>Education</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="memberTable">

</tbody>

</table>

</div>

<script src="/web/family_members.js"></script>

</body>
</html>
