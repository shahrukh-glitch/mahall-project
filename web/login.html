<!DOCTYPE html>
<html>

<head>

    <title>Mahall Management System</title>

    <link rel="stylesheet" href="/web/global.css">

</head>

<body class="login-page">

<div class="login-container">

    <div class="login-logo">

        🕌

    </div>

    <h1>Mahall Management System</h1>

    <p class="subtitle">

        Administrator Login

    </p>

    <input
        type="text"
        id="username"
        placeholder="Enter Username"
    >

    <input
        type="password"
        id="password"
        placeholder="Enter Password"
    >

    <button
        id="loginButton"
        onclick="login()">

        Login

    </button>

    <p id="message"></p>

    <div class="version">

        Version 1.0

    </div>

</div>

<script src="/web/login.js"></script>

</body>

</html>
