<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Salary Management</title>

    <link rel="stylesheet" href="/web/global.css">

</head>

<body>

<header class="header">

    <div class="logo">

        🕌 Mahall Management System

    </div>

    <div class="user-info">

        Welcome, Admin

        <button
            class="logout-btn"
            onclick="window.location.href='/'">

            Logout

        </button>

    </div>

</header>

<nav class="navbar">

    <a href="/dashboard">Dashboard</a>

    <a href="/member_registration">Members</a>

    <a href="/donation">Donations</a>

    <a href="/expense">Expenses</a>

    <a href="/salary" class="active">Salary</a>

    <a href="/cash_register">Cash Register</a>

    <a href="/reports">Reports</a>

</nav>

<div class="page-container">

    <div class="container">

        <h1>Salary Management</h1>

        <div class="card">

            <h2>Generate Payroll</h2>

            <div class="row">

                <div class="form-group">

                    <label>Month</label>

                    <select id="month">

                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Year</label>

                    <input
                        type="number"
                        id="year">

                </div>

            </div>

            <div class="button-group">

                <button
                    type="button"
                    id="generatePayroll">

                    Generate Payroll

                </button>

            </div>

        </div>

        <div class="card">

            <h2>Search Payslip</h2>

            <div class="row">

                <div class="form-group">

                     <label>Employee ID</label>

                    <input
                       type="text"
                       id="search_employee_id">

                </div>

                <div class="form-group">

                     <label>Month</label>

                    <select id="search_month">

                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>

                    </select>

                </div>

                <div class="form-group">

                     <label>Year</label>

                    <input
                        type="number"
                        id="search_year">

                </div>

            </div>

            <div class="button-group">

                <button
                    type="button"
                    id="searchPayslip">

                    Search Payslip

                </button>

            </div>

        </div>

        <div class="card">

            <h2>Salary History</h2>

            <table>

                <thead>

                    <tr>

                        <th>Employee ID</th>
                        <th>Name</th>
                        <th>Month</th>
                        <th>Year</th>
                        <th>Net Salary</th>
                        <th>Status</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="salaryTable">

                </tbody>

            </table>

        </div>

        <hr class="section-divider">

        <div class="card" id="payslipCard" style="display:none;">

             <h2>Salary Payslip</h2>

            <table>

               <tbody id="payslipTable">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="/web/payroll.js"></script>

</body>

</html>
